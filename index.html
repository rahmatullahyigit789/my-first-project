<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروژه اول من</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      text-align: center;
      padding: 55px 25px;
      border: 1px solid #293653;
      border-radius: 24px;
      background: linear-gradient(145deg, #17233f, #10182c);
      box-shadow: 0 20px 60px #0006;
    }

    .tag {
      color: #64e4c2;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin: 22px 0;
    }

    p {
      color: #c3cee0;
      line-height: 2;
      font-size: 17px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #64e4c2;
      color: #10182c;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      color: #91a0bb;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="tag">به وب‌سایت من خوش آمدید</div>
    <h1>سلام، خوش آمدید! 👋</h1>
    <p>
      این اولین پروژه وب‌سایت من است.
      به‌زودی امکانات و مطالب جدیدی به اینجا اضافه می‌کنم.
    </p>
    <a class="button"
       href="https://github.com/rahmatullahyigit789/my-first-project"
       target="_blank">
      مشاهده پروژه من
    </a>
    <footer>ساخته‌شده با علاقه ❤️</footer>
  </main>
</body>
</html>
