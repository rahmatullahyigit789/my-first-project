<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروژه اول من</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #eef2ff);
      color: #172033;
      padding: 20px;
    }
    main {
      max-width: 600px;
      padding: 40px 25px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 10px 35px #0002;
    }
    h1 { color: #2563eb; }
    p { line-height: 2; }
    a {
      display: inline-block;
      padding: 12px 20px;
      color: white;
      background: #2563eb;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div style="font-size:50px">🚀</div>
    <h1>به اولین پروژه من خوش آمدید!</h1>
    <p>سلام! من تازه برنامه‌نویسی را شروع کرده‌ام.</p>
    <p>این اولین صفحه وب من است که با HTML و CSS ساخته‌ام.</p>
    <a href="https://github.com/rahmatullahyigit789/my-first-project">دیدن پروژه من</a>
  </main>
</body>
</html>
