
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروژه اول من</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #e0f2fe, #eef2ff);
  color: #172033;
}

main {
  width: min(100%, 680px);
  padding: 42px 28px;
  text-align: center;
  background: white;
  border-radius: 22px;
  box-shadow: 0 16px 45px rgba(30,64,175,.12);
}

.icon { font-size: 52px; }
h1 { color: #1d4ed8; }
p { line-height: 2; color: #475569; }

a {
  display: inline-block;
  margin-top: 14px;
  padding: 12px 22px;
  color: white;
  background: #2563eb;
  border-radius: 10px;
  text-decoration: none;
}
</style>
</head>
<body>
<main>
  <div class="icon">🚀</div>
  <h1>به اولین پروژه من خوش آمدید!</h1>
  <p>سلام! من تازه برنامه‌نویسی را شروع کرده‌ام و این اولین صفحه وب من است.</p>
  <p>این صفحه را با HTML و CSS ساخته‌ام. به امید پروژه‌های بهتر و بزرگ‌تر!</p>
  <a href="https://github.com/rahmatullahyigit789/my-first-project">
    دیدن مخزن در گیت‌هاب
  </a>
</main>
</body>
</html>
